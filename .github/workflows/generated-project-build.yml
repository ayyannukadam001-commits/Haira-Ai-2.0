name: HAIRA Generated Android Project Build
on:
  workflow_dispatch:
    inputs:
      project_archive_path:
        description: Repository folder containing the generated Android Gradle project
        required: true
        type: string
      project_name:
        description: Display name for the APK release
        required: true
        type: string
permissions:
  contents: write
jobs:
  build-generated-project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract generated project archive
        env:
          PROJECT_ARCHIVE_PATH: ${{ inputs.project_archive_path }}
        run: |
          set -euo pipefail
          case "$PROJECT_ARCHIVE_PATH" in
            ""|/*|*..*) echo "Invalid project archive path"; exit 1 ;;
          esac
          test -f "$PROJECT_ARCHIVE_PATH"
          mkdir -p "$RUNNER_TEMP/haira-generated-project"
          unzip -q "$PROJECT_ARCHIVE_PATH" -d "$RUNNER_TEMP/haira-generated-project"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/haira-generated-project" -name settings.gradle.kts -type f -print -quit)")"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build generated APK
        run: |
          gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug
          APK_PATH="$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)"
          test -n "$APK_PATH"
          mkdir -p generated-apk
          cp "$APK_PATH" generated-apk/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAIRA-generated-${{ github.run_id }}
          path: generated-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: haira-generated-${{ github.run_id }}
          name: ${{ inputs.project_name }} APK
          prerelease: true
          generate_release_notes: false
          files: generated-apk/app-debug.apk
