name: HAIRA AI 2.0 Android Build
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'haira-generated-projects/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: haira-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and verify bundled SmolLM2 model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-all-errors \
            "https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/ddde4293f6050e8b81cca2ea2438c2fe444a0d5b/SmolLM2-360M-Instruct-Q4_K_M.gguf" \
            -o app/src/main/assets/default-model.gguf
          echo "2fa3f013dcdd7b99f9b237717fa0b12d75bbb89984cc1274be1471a465bac9c2  app/src/main/assets/default-model.gguf" | sha256sum --check
      - name: Build both application modules
        run: gradle --no-daemon :app:assembleDebug :haira-next:assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :haira-next:testDebugUnitTest
      - name: Verify the distributable is HAIRA AI Next (not legacy HAIRA)
        shell: bash
        run: |
          set -euo pipefail
          APK="haira-next/build/outputs/apk/debug/haira-next-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/haira-next-badging.txt
          grep -F "package: name='com.haira.ai.next'" /tmp/haira-next-badging.txt
          grep -F "application-label:'HAIRA AI Next'" /tmp/haira-next-badging.txt
          echo "Verified HAIRA Next APK: $APK"
      # Run the same isolated HAIRA Next launch/instrumentation test on PRs, pushes and manual builds.
      - name: Install, launch and test HAIRA AI Next on Android emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set -euxo pipefail
            adb wait-for-device
            timeout 300s bash -c '
              until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ] &&
                    adb shell service check package 2>/dev/null | grep -q found &&
                    adb shell service check activity 2>/dev/null | grep -q found &&
                    adb shell service check settings 2>/dev/null | grep -q found; do
                echo "Waiting for Android framework services..."
                sleep 5
              done'
            sleep 10
            adb devices -l
            adb shell df -h /data
            adb logcat -c
            adb logcat > emulator-logcat.txt &
            LOGCAT_PID=$!
            trap 'kill "$LOGCAT_PID" 2>/dev/null || true' EXIT
            gradle --no-daemon --stacktrace :haira-next:connectedDebugAndroidTest
      # The downloadable artifact contains ONLY HAIRA Next; the legacy :app APK is intentionally excluded.
      - name: Upload verified HAIRA AI Next APK
        uses: actions/upload-artifact@v4
        with:
          name: HAIRA-AI-NEXT-2.1.0-VERIFIED-APK
          path: haira-next/build/outputs/apk/debug/haira-next-debug.apk
          if-no-files-found: error
          retention-days: 30
      # A direct release is created only after the emulator test passes on main/manual runs.
      - name: Publish direct HAIRA AI Next APK download
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: haira-next-debug-${{ github.run_id }}
          name: HAIRA AI Next 2.1.0 Debug APK #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: |
            haira-next/build/outputs/apk/debug/haira-next-debug.apk
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAIRA-AI-NEXT-emulator-diagnostics
          path: emulator-logcat.txt
          if-no-files-found: warn
