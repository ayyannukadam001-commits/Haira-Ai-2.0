name: HAIRA AI 2.0 Android Build
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'haira-generated-projects/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: haira-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and verify bundled SmolLM2 model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-all-errors \
            "https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/ddde4293f6050e8b81cca2ea2438c2fe444a0d5b/SmolLM2-360M-Instruct-Q4_K_M.gguf" \
            -o app/src/main/assets/default-model.gguf
          echo "2fa3f013dcdd7b99f9b237717fa0b12d75bbb89984cc1274be1471a465bac9c2  app/src/main/assets/default-model.gguf" | sha256sum --check
      - name: Build debug APK with llama.cpp
        run: gradle --no-daemon :app:assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload built debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAIRA-AI-2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Publish direct APK download
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: haira-debug-${{ github.run_id }}
          name: HAIRA AI 2.0 Debug APK #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: app/build/outputs/apk/debug/app-debug.apk
      # Keep the heavyweight device/emulator smoke test available on demand.
      # It must not block normal APK builds when GitHub's hosted emulator is overloaded.
      - name: Install, launch and test local inference on Android emulator
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euxo pipefail
            adb wait-for-device
            adb devices -l
            adb shell getprop sys.boot_completed
            adb shell df -h /data
            adb logcat -c
            adb logcat > emulator-logcat.txt &
            LOGCAT_PID=$!
            trap 'kill "$LOGCAT_PID" 2>/dev/null || true' EXIT
            echo "Preflight install: surface the exact package-manager failure before Android Test Orchestrator runs"
            timeout 600s adb install --no-streaming -r -g app/build/outputs/apk/debug/app-debug.apk || { echo "APK install preflight failed or timed out; collecting package manager and device diagnostics"; adb shell df -h /data || true; adb shell dumpsys diskstats || true; adb logcat -d -t 3000 || true; exit 1; }
            adb shell pm path com.haira.ai
            gradle --no-daemon connectedDebugAndroidTest -x installDebug
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAIRA-AI-2.0-emulator-diagnostics
          path: emulator-logcat.txt
          if-no-files-found: warn
